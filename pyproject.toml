[project]
name = "magpie-dial"
version = "0.1.0"
description = "SkilledDragon minilab: Magpie Gemini CLI dial + failover stub (yetone/magpie pin)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "SkilledDragon LLC", email = "hello@skilleddragon.com" }]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
magpie-dial = "magpie_dial.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/magpie_dial"]

[tool.hatch.build.targets.wheel.sources]
"src/magpie_dial" = "magpie_dial"

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires GEMINI_API_KEY; skipped when unset",
]
