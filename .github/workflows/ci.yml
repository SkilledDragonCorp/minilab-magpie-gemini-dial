name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  MAGPIE_NO_ACCOUNTS: "1"
  DISABLE_TELEMETRY: "1"
  DO_NOT_TRACK: "1"

jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync
        run: uv sync --locked --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pytest (keyless; no live Gemini)
        run: uv run pytest -q

      - name: Check skills layout
        run: python3 scripts/check-skills

      - name: Banned phrases
        run: python3 scripts/check-banned-phrases

      - name: Upstream parity
        run: python3 scripts/check-upstream-parity

  upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Vendor yetone/magpie at pin
        run: bash scripts/vendor-upstream.sh

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: vendor/magpie/go.mod

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Upstream Linux keyless suite
        run: bash scripts/upstream-magpie.sh
        env:
          MAGPIE_NO_ACCOUNTS: "1"
          DISABLE_TELEMETRY: "1"
          DO_NOT_TRACK: "1"

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks 8.30.1
        run: |
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Gitleaks
        run: gitleaks git --redact --verbose .

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync
        run: uv sync --locked --group dev

      - name: pip-audit
        run: |
          uv export --frozen --format requirements-txt --no-emit-project > /tmp/req.txt
          uvx pip-audit --strict -r /tmp/req.txt
